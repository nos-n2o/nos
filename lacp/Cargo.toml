[package]
name    = "nos-lacp"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nos-pki            = { workspace = true }
tokio              = { workspace = true, features = ["signal"] }
tracing            = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
nos-proto          = { workspace = true }
nos-daemon         = { workspace = true }
nos-l2-socket      = { workspace = true }
tokio-util         = { workspace = true }
futures            = { workspace = true }
thiserror          = { workspace = true }
md-5               = { workspace = true }

[[bin]]
name = "nos-lacpd"
path = "src/main.rs"

[dev-dependencies]
nos-pki  = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }
