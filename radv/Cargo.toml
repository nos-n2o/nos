[package]
name    = "nos-radv"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nos-pki         = { workspace = true }
tokio           = { workspace = true, features = ["signal"] }
tracing         = { workspace = true }
clap            = { workspace = true }
anyhow          = { workspace = true }
nos-proto       = { workspace = true }
nos-daemon      = { workspace = true }
nos-radv-socket = { workspace = true }
tokio-util      = { workspace = true }
futures         = { workspace = true }
thiserror       = { workspace = true }

[[bin]]
name = "nos-radvd"
path = "src/main.rs"

[dev-dependencies]
nos-pki  = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
