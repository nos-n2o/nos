[package]
name    = "nos-watchdog"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tokio              = { workspace = true, features = ["signal", "process"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
nix                = { workspace = true }
nos-proto          = { workspace = true }
nos-log-client     = { workspace = true }
futures            = { workspace = true }
tokio-util         = { workspace = true }
nos-pki            = { workspace = true }
nos-password       = { workspace = true }
getrandom          = { workspace = true }
sha2               = { workspace = true }

[[bin]]
name = "nos-watchdogd"
path = "src/main.rs"

[dev-dependencies]
argon2   = { version = "0.5", features = ["std", "password-hash", "rand"] }
nos-pki  = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
tempfile = { workspace = true }
x509-parser = { workspace = true }
