name: CI

on:
  push:
    branches: ["master", "main"]
  # `labeled`: adding the `miri` label runs the `miri` job (it reruns the other jobs too).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # `mutants` and the two canaries: the canaries float (newest stable / nightly), so
  # the cron finds drift within a day without anyone pushing. Every other job skips it.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The toolchain fmt/clippy/test/coverage run on. Bump it on purpose (see CLAUDE.md
  # "Rust toolchain"); `clippy-canary` warns when the newest stable would break.
  # Every job runs the Makefile target, so a local `make <target>` is the same command
  # on the same toolchain (natively, or in the nos-ci image on a host without it).
  RUST_TOOLCHAIN: "1.99.0"
  # The dated nightly Miri runs on (`make miri`); `miri-canary` tries the newest one.
  MIRI_TOOLCHAIN: "nightly-2026-10-03"

permissions:
  contents: read

jobs:
  claude-md:
    name: CLAUDE.md size
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make claude-md-size

  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: make fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make clippy

  clippy-canary:
    name: Clippy (stable canary)
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.canary.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Step-level continue-on-error keeps the check green: a job-level one still
      # shows a red X on the commit/PR.
      - id: canary
        continue-on-error: true
        # `+stable`: rust-toolchain.toml would otherwise pin it back to RUST_TOOLCHAIN.
        run: cargo +stable clippy --workspace --all-targets
      - if: steps.canary.outcome == 'failure'
        run: echo "::warning::The newest stable rustc breaks clippy -D warnings; bump RUST_TOOLCHAIN in ci.yml (see CLAUDE.md \"Rust toolchain\")."

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      # Line tables only: full debuginfo filled the runner disk (#827). Local builds keep
      # full debuginfo (Cargo.toml untouched), so gdb is unaffected.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      # Preinstalled toolchains we never use (~25-30 GB); df before/after for diagnosis.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest
      - run: make test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      # Line tables only: full debuginfo filled the runner disk (#827). Local builds keep
      # full debuginfo (Cargo.toml untouched), so gdb is unaffected.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      # Preinstalled toolchains we never use (~25-30 GB); df before/after for diagnosis.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - run: make coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    container:
      image: semgrep/semgrep:latest@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Text output, so findings print in the log like `make sast`. No SARIF upload:
      # code scanning is off on this private repo, so it could never succeed.
      - run: semgrep scan --config p/rust --exclude target --error --metrics=off .

  # Miri takes 17-31 min and the crates it runs have no `unsafe` (#1038): off the plain PR
  # path. Runs on schedule/dispatch/push, and on a PR with the `miri` label or a Cargo.lock change.
  miri-gate:
    name: Miri gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'miri') }}
          BASE: ${{ github.base_ref }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ] && [ "$LABELED" != true ]; then
            git diff --name-only "origin/$BASE...HEAD" | grep -qx Cargo.lock || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Miri: run=$run ($EVENT, label=$LABELED)"

  miri:
    name: Miri (UB check)
    runs-on: ubuntu-latest
    needs: miri-gate
    if: needs.miri-gate.outputs.run == 'true'
    # Fail fast: with no cap a slow suite ran 5 h until GitHub cancelled it (#827).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pinned stable too: `make` checks rustc against it to stay native.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.MIRI_TOOLCHAIN }}
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Only the pure-logic leaf crates: Miri cannot execute FFI, and everything else in
      # the workspace either is FFI (`nos-tcp-auth`/`nos-l2-socket` — raw setsockopt and
      # AF_PACKET), runs TLS through aws-lc-rs's C code in its tests (`nos-pki` and every
      # daemon/client), or is argon2 (`nos-password`), hours long under an interpreter.
      # RUSTFLAGS/MIRIFLAGS are set by the Makefile target.
      - run: make miri

  miri-canary:
    name: Miri (nightly canary)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      outcome: ${{ steps.canary.outcome }}
    env:
      RUSTFLAGS: "-D warnings -A deprecated"
      MIRIFLAGS: "-Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: canary
        continue-on-error: true
        run: cargo +nightly miri test -p nos-rpl -p nos-ospf-common -p nos-proto
      - if: steps.canary.outcome == 'failure'
        run: echo "::warning::The newest nightly breaks Miri; bump MIRI_TOOLCHAIN in ci.yml once a fixed one exists (see CLAUDE.md \"Rust toolchain\")."

  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Run nightly or on manual dispatch only — too slow for every PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest
      # Same entry point as local; the per-test cap comes from .config/nextest.toml.
      # `make mutants` reports survivors/timeouts (cargo-mutants exit 2/3) without
      # failing; only usage errors and a red unmutated baseline fail the job (#362).
      - name: Run shard ${{ matrix.shard }}/8
        run: make mutants MUTANTS_ARGS="--shard ${{ matrix.shard }}/8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    # Nightly or manual dispatch only; a crash fails the job (unlike mutants survivors).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      # No seeds in the repo: the corpus accumulates across nightly runs here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: make fuzz-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # A red master (or canary) opens one `ci-red` issue, or comments on the open one, the
  # same day — instead of the next PR finding it (#180). Never on PRs: their checks are
  # the gate there.
  alert:
    name: Alert on red
    runs-on: ubuntu-latest
    needs: [claude-md, fmt, clippy, clippy-canary, test, coverage, audit, deny, sast, miri-gate, miri, miri-canary, mutants, fuzz-smoke]
    if: >-
      always() && github.event_name != 'pull_request' &&
      (contains(needs.*.result, 'failure') ||
       needs.clippy-canary.outputs.outcome == 'failure' ||
       needs.miri-canary.outputs.outcome == 'failure')
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          red=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.outputs.outcome == "failure") | .key' <<<"$NEEDS" | paste -sd, -)
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="CI red on \`$GITHUB_REF_NAME\` ($GITHUB_EVENT_NAME, $GITHUB_SHA): **$red** — $url"
          gh label create ci-red --color B60205 --description "CI is red on master or a canary" 2>/dev/null || true
          n=$(gh issue list --label ci-red --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
          else gh issue create --label ci-red --title "CI red on $GITHUB_REF_NAME: $red" --body "$body"; fi
