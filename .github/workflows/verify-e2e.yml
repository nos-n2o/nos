name: verify-e2e

# Real end-to-end verification against a real kernel (BGP/OSPF/RPL/interface
# drivers) via tools/e2e (`nos-e2e`). Too slow/privileged for every PR — like
# ci.yml's `mutants` job, this only runs on a schedule or manual dispatch.
# Each group is self-contained (its own `up` + checks + teardown) and runs on
# its own independent runner, so there's no collision between the hardcoded
# container names/network nos-e2e uses.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [base, drivers, rpl, ospf-suite, multi, pki-suite, pki-crl]
    env:
      # Keep the containers on failure so the step below can read them.
      VERIFY_E2E_KEEP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: nos:local
          load: true
          build-args: NOS_BUILD_REV=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      # Kernel modules the routers need + file capabilities on nos-ribd
      # (the same script `make e2e-preflight` runs locally).
      - run: df -h /
      - run: tools/ci/e2e-preflight.sh
      - run: cargo run --release -p nos-e2e -- ${{ matrix.group }}
      - name: Container state and logs
        if: failure()
        run: |
          docker ps -a
          docker logs router-a 2>&1 | tail -200 || true

  # Same as ci.yml's `alert`: a red nightly opens or updates the `ci-red` issue.
  alert:
    name: Alert on red
    runs-on: ubuntu-latest
    needs: [verify]
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="verify-e2e red on \`$GITHUB_REF_NAME\` ($GITHUB_EVENT_NAME, $GITHUB_SHA): one or more groups failed — $url"
          gh label create ci-red --color B60205 --description "CI is red on master or a canary" 2>/dev/null || true
          n=$(gh issue list --label ci-red --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
          else gh issue create --label ci-red --title "verify-e2e red on $GITHUB_REF_NAME" --body "$body"; fi
