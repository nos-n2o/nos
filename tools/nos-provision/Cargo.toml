[package]
name    = "nos-provision"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Test-only flags/env (e2e, system test); never in a release build (#1214).
dev-args = []

[lints]
workspace = true

[dependencies]
nos-proto  = { workspace = true }
nos-pki    = { workspace = true }
tokio      = { workspace = true }
tokio-util = { workspace = true }
futures    = { workspace = true }
clap       = { workspace = true }
anyhow     = { workspace = true }
ipnet      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
nos-pki  = { workspace = true, features = ["testing"] }

[lib]
name = "nos_provision"
path = "src/lib.rs"

[[bin]]
name = "nos-provision"
path = "src/main.rs"
