[package]
name    = "nos-e2e"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nos-proto     = { workspace = true }
nos-provision = { path = "../nos-provision", version = "0.1.0" }
tokio         = { workspace = true, features = ["signal"] }
futures       = { workspace = true }
clap          = { workspace = true }
anyhow        = { workspace = true }
serde_json    = { workspace = true }
serde_norway    = { workspace = true }
reqwest       = { workspace = true, features = ["rustls-no-provider", "http2"] }
nos-pki       = { workspace = true }
crc32fast     = { workspace = true }
rustls        = { workspace = true }
tokio-rustls  = { workspace = true }
base64        = { workspace = true }
regex         = { workspace = true }
bollard       = { workspace = true }
tar           = { workspace = true }
bytes         = { workspace = true }
rcgen         = { workspace = true }
sha2          = { workspace = true }
# SSH client for `ssh-login-shell` (#992): keyboard-interactive auth, pty, shell/exec; no `ssh` CLI
# in the harness. libssh2 over the system OpenSSL (`libssl-dev` + `pkg-config`); russh pulled chrono
# through russh-util (#1250).
ssh2          = "0.9"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "nos-e2e"
path = "src/main.rs"
