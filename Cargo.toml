[workspace]
members = ["proto", "proto-derive", "config", "bgp", "rib", "interface", "log", "ospf", "ospf-common", "ospfv3", "cli", "watchdog", "tools/nos-provision", "tools/e2e", "tcp-auth", "rpl", "log-client", "daemon", "l2-socket", "bfd-socket", "tc", "acl", "lacp", "stp", "lldp", "bfd", "fdb", "rest", "password", "pki", "test-support", "tools/rtr-stub"]
resolver = "3"

[workspace.package]
license = "GPL-3.0-only"
edition = "2024"

[workspace.dependencies]
zeroize = "1"
# `full` is not used: crates add `signal`/`process` themselves where they need them.
tokio       = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_norway = "0.9"
tracing     = "0.1"
thiserror   = "2"
bytes       = "1"
garde       = { version = "0.22", features = ["derive", "full"] }
precis-core     = "0.2"
precis-profiles = "0.2"
ipnet       = { version = "2", features = ["serde"] }
postcard    = { version = "1", features = ["alloc"] }
tokio-util  = { version = "0.7", features = ["codec"] }
futures     = "0.3"
reqwest     = { version = "0.13", default-features = false, features = ["json", "stream"] }
regex       = "1"
bollard     = "0.21"
tar         = "0.4"
nos-proto          = { path = "proto", version = "0.1.0" }
nos-proto-derive   = { path = "proto-derive", version = "0.1.0" }
nos-tcp-auth       = { path = "tcp-auth", version = "0.1.0" }
nos-password       = { path = "password", version = "0.1.0" }
nos-pki            = { path = "pki", version = "0.1.0" }
nos-test-support   = { path = "test-support", version = "0.1.0" }
nos-l2-socket      = { path = "l2-socket", version = "0.1.0" }
nos-bfd-socket     = { path = "bfd-socket", version = "0.1.0" }
nos-tc             = { path = "tc", version = "0.1.0" }
nos-rpl            = { path = "rpl", version = "0.1.0" }
nos-log-client     = { path = "log-client", version = "0.1.0" }
nos-daemon         = { path = "daemon", version = "0.1.0" }
nos-ospf-common    = { path = "ospf-common", version = "0.1.0" }
clap               = { version = "4", features = ["derive"] }
anyhow             = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reedline            = "0.51.0"
nix                 = { version = "0.30", default-features = false, features = ["signal", "process"] }
async-trait         = "0.1"
rtnetlink           = "0.23"
netlink-packet-core  = "0.9"
netlink-packet-route = "0.33"
netlink-sys          = { version = "0.9", features = ["tokio_socket"] }
crc32fast            = "1"
fs2                 = "0.4"
socket2             = { version = "0.6", features = ["all"] }
smallvec            = "1"
libc                = "0.2"
md-5                = "0.10"
sha1                = "0.10"
sha2                = "0.10"
getrandom           = "0.2"
hmac                = "0.12"
axum                = "0.8"
utoipa              = { version = "6", features = ["axum_extras"] }
utoipa-axum         = "0.3"
# `vendored`: the UI assets ship inside the crate — no CDN at runtime (the API
# lives in a management VRF) and no GitHub download at build time.
utoipa-swagger-ui   = { version = "10.0.2", features = ["axum", "vendored"] }
percent-encoding    = "2"
rpassword           = "7"
base64              = "0.22"
# aws-lc-rs, not ring: it is the only rustls provider with ML-KEM key exchange
# and ML-DSA signatures. TLS 1.3 only (no `tls12`) — see pki/CLAUDE.md.
rustls              = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls        = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-webpki       = { version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
rcgen               = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-parser         = "0.18"
arc-swap            = "1"
time                = "0.3"

# test dependencies
tempfile    = "3"
shlex       = "2"
proptest    = "1"
insta       = "1"

# argon2 is deliberately slow; unoptimized it makes every password test take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# A panic in any task must take the daemon down so the watchdog restarts it (#419).
[profile.release]
panic = "abort"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic              = { level = "warn", priority = -1 }
# allow noisy pedantic lints that produce more churn than value at this stage
must_use_candidate        = "allow"
module_name_repetitions   = "allow"
missing_errors_doc        = "allow"
missing_panics_doc        = "allow"
# Length is bounded at `too-many-lines-threshold` (clippy.toml, 150); depth by
# `excessive-nesting-threshold`. A flat one-arm-per-topic table opts out with
# `#[allow(clippy::too_many_lines, reason = "...")]`, never a blanket allow.
too_many_lines             = "warn"
excessive_nesting          = "warn"
