[package]
name    = "nos-proto"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
garde      = { workspace = true }
ipnet      = { workspace = true }
thiserror  = { workspace = true }
postcard   = { workspace = true }
tokio-util = { workspace = true }
bytes      = { workspace = true }
base64     = { workspace = true }
futures    = { workspace = true }
nos-rpl    = { workspace = true }
nos-proto-derive = { workspace = true }
utoipa     = { workspace = true, optional = true }
arbitrary  = { version = "=1.5.0", features = ["derive"], optional = true }
precis-core     = { workspace = true }
precis-profiles = { workspace = true }

[features]
# `ToSchema` derives for the REST API's OpenAPI spec (`nos-restd`); off for every other daemon.
openapi = ["dep:utoipa"]
# `Arbitrary` derives so the `nos-fuzz` `cli_format` target can build renderer inputs; enabled only by `fuzz/Cargo.toml` (#1216, tools/ci/no-arbitrary.sh).
arbitrary = ["dep:arbitrary"]

[dev-dependencies]
proptest = { workspace = true }
